[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; ---------- tmux-сессия "main" с Claude Code (создаётся один раз при старте контейнера)
[program:claude-tmux]
command=/usr/local/bin/start-claude-tmux
user=agent
environment=HOME="/home/agent",USER="agent"
directory=/workspace
priority=10
autorestart=false
startsecs=0
exitcodes=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------- веб-терминал (подключается к той же tmux-сессии)
[program:ttyd]
command=/usr/local/bin/start-ttyd
user=agent
environment=HOME="/home/agent",USER="agent"
directory=/workspace
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/ttyd.log
redirect_stderr=true

; браузер — в отдельном контейнере `browser`
