[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 %(ENV_SCREEN)s -nolisten tcp -dpi 96
user=browser
environment=HOME="/home/browser",USER="browser"
priority=10
autorestart=true
stdout_logfile=/var/log/supervisor/xvfb.log
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox
user=browser
environment=HOME="/home/browser",USER="browser",DISPLAY=":1"
priority=20
autorestart=true
stdout_logfile=/var/log/supervisor/openbox.log
redirect_stderr=true

; VNC только на localhost; наружу — через noVNC (websockify) с паролем VNC
[program:x11vnc]
command=/usr/bin/x11vnc -display :1 -rfbport 5900 -localhost -rfbauth /home/browser/.vnc/passwd -forever -shared -noxdamage -quiet
user=browser
environment=HOME="/home/browser",USER="browser"
priority=30
autorestart=true
startretries=20
stdout_logfile=/var/log/supervisor/x11vnc.log
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 127.0.0.1:5900
user=browser
environment=HOME="/home/browser",USER="browser"
priority=40
autorestart=true
stdout_logfile=/var/log/supervisor/novnc.log
redirect_stderr=true

[program:chrome]
command=/usr/local/bin/start-chrome
user=browser
environment=HOME="/home/browser",USER="browser",DISPLAY=":1"
priority=50
autorestart=true
startsecs=5
startretries=20
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/chrome.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
redirect_stderr=true
